<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding-bottom:40px}
.topbar{background:#1e293b;padding:14px 24px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.topbar h1{font-size:1.05rem;font-weight:700;color:#f8fafc;flex:1}
.topbar .campo-badge{background:#0ea5e9;color:#fff;padding:5px 12px;border-radius:20px;font-size:0.75rem;font-weight:700}
.nav-btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all .15s}
.nav-btn.active{background:#0ea5e9;color:#fff}
.nav-btn:not(.active){background:#334155;color:#94a3b8}
.nav-btn:not(.active):hover{background:#475569;color:#e2e8f0}
.wrap{padding:16px 24px;max-width:1400px;margin:0 auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:0.95rem;color:#f8fafc;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:0.67rem;color:#64748b;text-transform:uppercase;letter-spacing:.4px}
select,input[type=date],input[type=text],input[type=number],textarea{background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;padding:7px 10px;font-size:0.82rem;outline:none;font-family:inherit}
select:focus,input:focus,textarea:focus{border-color:#38bdf8}
button.btn{padding:8px 16px;background:#0ea5e9;border:none;border-radius:6px;color:#fff;font-size:0.8rem;font-weight:600;cursor:pointer}
button.btn:hover{background:#0284c7}
button.btn.secondary{background:#334155;color:#e2e8f0}
button.btn.secondary:hover{background:#475569}
button.btn.small{padding:4px 10px;font-size:0.72rem}
button.btn.danger{background:#7f1d1d;color:#fecaca}
button.btn.danger:hover{background:#991b1b}
table{width:100%;border-collapse:collapse;font-size:0.8rem}
thead tr{background:#0f172a}
th{padding:8px 10px;text-align:left;font-size:0.65rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;font-weight:600;border-bottom:1px solid #334155;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid #24324a}
tbody tr:hover{background:#16213a}
.tw{overflow-x:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px}
.stat .lbl{font-size:0.63rem;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.stat .val{font-size:1.3rem;font-weight:700}
.green{color:#34d399}.yellow{color:#fbbf24}.blue{color:#38bdf8}.gray{color:#94a3b8}.red{color:#f87171}.purple{color:#a78bfa}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.68rem;font-weight:600}
.badge.ok{background:#064e3b;color:#34d399}
.badge.warn{background:#451a03;color:#fbbf24}
.badge.off{background:#3b0764;color:#c084fc}
.badge.gray{background:#334155;color:#94a3b8}
.badge.red{background:#450a0a;color:#f87171}
.mini-in{width:64px}
input[type=number].mini-in{width:64px;text-align:center}
.nov-in{width:100%;min-width:140px}
.saved-flash{font-size:0.72rem;color:#34d399;opacity:0;transition:opacity .3s;margin-left:8px}
.saved-flash.show{opacity:1}
.empty{text-align:center;padding:40px;color:#475569;font-size:0.85rem}
.link-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #24324a}
.link-row code{background:#0f172a;padding:4px 8px;border-radius:5px;font-size:0.72rem;color:#7dd3fc;flex:1;overflow-x:auto;white-space:nowrap}
.tabs2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab2{padding:6px 14px;border-radius:20px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:0.75rem;font-weight:600}
.tab2.active{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.sub{font-size:0.72rem;color:#64748b;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#0f172a;border:1px solid #334155;padding:3px 9px;border-radius:14px;font-size:0.72rem;color:#94a3b8}
.loading{display:flex;align-items:center;justify-content:center;padding:80px;color:#64748b;font-size:0.9rem}
.footer-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.section-title{font-size:0.68rem;text-transform:uppercase;letter-spacing:.6px;color:#64748b;font-weight:700;margin:16px 0 8px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:#0f172a;border:1px dashed #334155;border-radius:8px;padding:10px;margin-top:8px}
.hint{font-size:0.7rem;color:#64748b;margin-top:4px}
@media(max-width:700px){.row{flex-direction:column;align-items:stretch}.wrap{padding:10px}}
</style>
</head>

/* =============== STORAGE HELPERS (Firebase Realtime Database) =============== */
const FB_URL = 'https://aireadores-caesa-default-rtdb.firebaseio.com';

// Firebase convierte objetos con claves 0,1,2,... a arrays.
// Esta función los revierte a objeto con claves como strings.
function normalizePiscinasObj(piscinas){
  if(!piscinas || typeof piscinas !== 'object') return {};
  if(!Array.isArray(piscinas)) return piscinas;
  // Firebase coerced integer-keyed object → restore as {index: value}
  const obj = {};
  piscinas.forEach((v,i)=>{ if(v!=null) obj[String(i)] = v; });
  return obj;
}

async function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms || 10000);
  try{
    return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
  } finally { clearTimeout(t); }
}

function keyToFbPath(key){
  if(key === 'config:camps')         return 'camps';
  if(key === 'roster:personal:all')  return 'personal';
  if(key === 'roster:piscinas:all')  return 'piscinas';
  if(key === 'db:initialized:v1')    return 'db_initialized';
  if(key === 'config:taller')        return 'taller';
  if(key.startsWith('report:')){
    const parts = key.split(':');
    return 'reportes/'+parts[1]+'/'+parts[2];
  }
  return key.replace(/:/g,'_');
}

async function sget(key){
  try{
    const res = await fetchWithTimeout(FB_URL+'/'+keyToFbPath(key)+'.json?_ts='+Date.now());
    if(!res.ok){ console.error('firebase get failed', key, res.status); return null; }
    return await res.json(); // devuelve null si no existe
  }catch(e){ console.error('firebase get failed', key, e); return null; }
}

async function sset(key, val){
  try{
    const res = await fetchWithTimeout(FB_URL+'/'+keyToFbPath(key)+'.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
    if(!res.ok){
      const err = await res.text();
      console.error('firebase set failed', key, res.status, err);
      window._lastSsetError = 'HTTP '+res.status+': '+err.slice(0,200);
      return null;
    }
    window._lastSsetError = null;
    return true;
  }catch(e){
    console.error('firebase set failed', key, e);
    window._lastSsetError = 'Error de red: '+String(e);
    return null;
  }
}

async function slist(prefix){
  // Solo se usa para prefix='report:' (borrar reportes en debug)
  if(prefix === 'report:'){
    try{
      const res = await fetchWithTimeout(FB_URL+'/reportes.json?shallow=true&_ts='+Date.now());
      if(!res.ok) return [];
      const slugs = await res.json();
      if(!slugs) return [];
      const keys = [];
      for(const slug of Object.keys(slugs)){
        const r2 = await fetchWithTimeout(FB_URL+'/reportes/'+slug+'.json?shallow=true');
        if(!r2.ok) continue;
        const dates = await r2.json();
        if(!dates) continue;
        for(const date of Object.keys(dates)) keys.push('report:'+slug+':'+date);
      }
      return keys;
    }catch(e){ return []; }
  }
  return [];
}

async function sgetPrefixMap(prefix){
  // prefix = 'report:SLUG:' → lee /reportes/SLUG y devuelve {'report:SLUG:DATE': valor}
  if(prefix.startsWith('report:')){
    const slug = prefix.split(':')[1];
    try{
      const res = await fetchWithTimeout(FB_URL+'/reportes/'+slug+'.json?_ts='+Date.now(), {}, 15000);
      if(!res.ok){ console.error('firebase prefix failed', prefix, res.status); return {}; }
      const data = await res.json();
      if(!data) return {};
      const map = {};
      Object.entries(data).forEach(([date, val])=>{
        // Normalizar piscinas por si Firebase convirtió el objeto a array
        if(val && val.piscinas) val.piscinas = normalizePiscinasObj(val.piscinas);
        map['report:'+slug+':'+date] = val;
      });
      return map;
    }catch(e){ console.error('firebase prefix failed', prefix, e); return {}; }
  }
  return {};
}

async function initInner(){
  let camps = await sget('config:camps');
  if(!camps){
    camps = DEFAULT_CAMPS;
    await sset('config:camps', camps);
  }

  /* Asegura que RECORCHOLIS 2 esté en la lista de campamentos. */
  if(!camps.find(c=>c.slug==='RECORCHOLIS2')){
    const idx = camps.findIndex(c=>c.slug==='RECORCHOLIS1');
    const nuevoCamp = {slug:'RECORCHOLIS2', nombre:'RECORCHOLIS 2'};
    if(idx>=0) camps.splice(idx+1,0,nuevoCamp); else camps.push(nuevoCamp);
    const okCamps = await sset('config:camps', camps);
    if(!okCamps) console.error('No se pudo guardar RECORCHOLIS2 en config:camps, se reintentará en la próxima carga');
  }
  CAMPS = camps;

  /* ═══════════════════════════════════════════════════════════════════
     CARGA DE DATOS — Regla fundamental:
     Si ya existen datos en Supabase (gestionados por el admin), NUNCA
     sobrescribirlos. Solo se siembra la primera vez que la base de datos
     está completamente vacía. Esto evita que recargas de página o accesos
     simultáneos de múltiples usuarios destruyan los cambios del admin.
     ═══════════════════════════════════════════════════════════════════ */

  let allPersonal = await sget('roster:personal:all');
  let allPiscinas = await sget('roster:piscinas:all');
  const dbReady  = await sget('db:initialized:v1');

  if(!dbReady && !allPersonal && !allPiscinas){
    /* ── PRIMERA INSTALACIÓN: sembrar y aplicar todas las importaciones ── */
    console.log('Primera carga: inicializando base de datos...');
    allPersonal = JSON.parse(JSON.stringify(SEED_PERSONAL));
    allPiscinas  = JSON.parse(JSON.stringify(SEED_PISCINAS));

    // Aplicar importación de piscinas y asignaciones de operador
    for(const slug in NEW_PISCINAS_IMPORT){
      const lst = NEW_PISCINAS_IMPORT[slug];
      if(!lst.length) continue;
      allPiscinas[slug] = allPiscinas[slug] || [];
      const existingIds = new Set(allPiscinas[slug].map(p=>p.id));
      lst.forEach(p=>{ if(!existingIds.has(p.id)) allPiscinas[slug].push(p); });
    }
    for(const slug in PERSON_PISCINAS_IMPORT){
      const map = PERSON_PISCINAS_IMPORT[slug];
      const list = allPersonal[slug] || [];
      for(const personId in map){
        const p = list.find(p=>p.id===personId);
        if(p) p.piscinas = map[personId];
      }
    }
    // Agregar campo estado a todo el personal
    for(const slug in allPersonal)
      for(const p of allPersonal[slug])
        if(!p.estado) p.estado = (p.activo===false ? 'Renunció' : 'Trabajando');

    // Agregar sectores a Pantrusko 2
    (allPiscinas['PANTRUSKO2']||[]).forEach(p=>{
      const sec = PANTRUSKO2_SECTORS_IMPORT[p.id];
      if(sec) p.sector = sec;
    });

    // Guardar todo en Supabase
    const okP = await sset('roster:personal:all', allPersonal);
    const okQ = await sset('roster:piscinas:all',  allPiscinas);
    const tallerConfig = Object.assign({}, TALLER_IMPORT);
    await sset('config:taller', tallerConfig);
    TALLER = tallerConfig;
    if(okP && okQ){
      await sset('db:initialized:v1', true);
      console.log('Base de datos inicializada correctamente.');
    } else {
      console.error('No se pudo completar la inicialización; se reintentará en la próxima carga.');
    }

  } else {
    /* ── CARGA NORMAL: los datos ya existen, solo leer ── */
    if(!allPersonal) allPersonal = JSON.parse(JSON.stringify(SEED_PERSONAL));
    if(!allPiscinas)  allPiscinas  = JSON.parse(JSON.stringify(SEED_PISCINAS));

    // Corrección aditiva y no-destructiva: agregar campo "estado" si falta
    // (nunca elimina ni mueve personal)
    let estadoChanged = false;
    for(const slug in allPersonal)
      for(const p of allPersonal[slug])
        if(!p.estado){ p.estado = (p.activo===false ? 'Renunció' : 'Trabajando'); estadoChanged = true; }
    if(estadoChanged) sset('roster:personal:all', allPersonal); // en background, sin bloquear

    // Cargar config de taller
    TALLER = (await sget('config:taller')) || Object.assign({}, TALLER_IMPORT);
  }

  PERSONAL = allPersonal;
  PISCINAS  = allPiscinas;

  // Asegurar que todos los campamentos existan en los objetos (sin guardar en Supabase)
  for(const c of CAMPS){
    if(!PISCINAS[c.slug])  PISCINAS[c.slug]  = [];
    if(!PERSONAL[c.slug])  PERSONAL[c.slug]  = [];
  }

  if(MODE==='campo'){
    if(!CAMPS.find(c=>c.slug===URL_CAMPO)){
      document.getElementById('app').innerHTML = '<div class="card"><h2>⚠️ Enlace inválido</h2><p class="sub">No se encontró el campamento "'+esc(URL_CAMPO)+'". Verifica el enlace con el administrador.</p></div>';
      document.getElementById('nav-area').innerHTML='';
      return;
    }
    currentCampAdmin = URL_CAMPO;
  } else {
    currentCampAdmin = CAMPS[0].slug;
  }
  renderNav();
  render();

  // Auto-refresh silencioso en modo campo: cada 90 segundos actualiza PERSONAL y PISCINAS
  // sin borrar lo que el operador tenga escrito (actualizarDatos ya hace eso).
  if(MODE==='campo'){
    window._campoRefreshTimer = setInterval(async ()=>{
      // Solo refrescar si no hay un input enfocado (el operador no está escribiendo ahora)
      const active = document.activeElement;
      const escribiendo = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');
      if(escribiendo) return;
      await actualizarDatosSilencioso();
    }, 90000);
  }
}

// Igual que actualizarDatos pero sin alert/loading — para el auto-refresh en campo.
// Solo re-renderiza si PERSONAL o PISCINAS realmente cambiaron (evita parpadeos).
async function actualizarDatosSilencioso(){
  try{
    const freshPersonal = await sget('roster:personal:all');
    const freshPiscinas = await sget('roster:piscinas:all');
    if(!freshPersonal && !freshPiscinas) return; // sin conexión, no cambiar nada

    // Detectar si algo cambió comparando con los datos actuales en memoria
    const piscinasStr = JSON.stringify(PISCINAS);
    const personalStr = JSON.stringify(PERSONAL);
    const freshPiStr = JSON.stringify(freshPiscinas);
    const freshPeStr = JSON.stringify(freshPersonal);
    const cambioDetectado = (freshPiscinas && freshPiStr !== piscinasStr) ||
                            (freshPersonal && freshPeStr !== personalStr);

    // Actualizar datos en memoria
    if(freshPersonal){ PERSONAL = freshPersonal; for(const c of CAMPS){ if(!PERSONAL[c.slug]) PERSONAL[c.slug]=[]; } }
    if(freshPiscinas){ PISCINAS = freshPiscinas; for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; } }

    if(cambioDetectado){
      // Capturar valores actuales del DOM antes de re-renderizar
      const domPiscinas = {};
      document.querySelectorAll('#reg-piscinas-body tr[data-ps]').forEach(tr=>{
        const pid = tr.getAttribute('data-ps');
        domPiscinas[pid] = {
          enc: parseInt(tr.querySelector('.ps-enc')?.value||0)||0,
          apg: parseInt(tr.querySelector('.ps-apg')?.value||0)||0,
          det: parseInt(tr.querySelector('.ps-det')?.value||0)||0,
          nov: (tr.querySelector('.ps-nov')?.value||'').trim()
        };
      });
      const domPersonal = {};
      document.querySelectorAll('#reg-personal-body tr[data-pe]').forEach(tr=>{
        const pid = tr.getAttribute('data-pe');
        domPersonal[pid] = {
          estado: tr.querySelector('.pe-estado')?.value || 'EN CAMPAMENTO',
          novedad: (tr.querySelector('.pe-nov')?.value||'').trim()
        };
      });
      const hayDatosDOM = Object.keys(domPiscinas).length > 0 || Object.keys(domPersonal).length > 0;
      if(hayDatosDOM){
        // El operador tiene datos sin guardar en el formulario.
        // Guardamos en regDraft por si acaso, pero NO re-renderizamos para no
        // borrar lo que está escribiendo. Los datos de PISCINAS/PERSONAL ya se
        // actualizaron en memoria arriba — se usarán en el próximo guardado.
        if(!regDraft) regDraft = {piscinas:{}, personal:{}};
        Object.assign(regDraft.piscinas, domPiscinas);
        Object.assign(regDraft.personal, domPersonal);
        // NO llamar render() — proteger el formulario en curso
      } else {
        // Guardar posición de scroll antes de re-renderizar (por si acaso)
        window._savedScrollY = window.scrollY;
        render(); // solo re-renderiza si el formulario está vacío (nadie llenando)
      }
    }

    // Siempre actualizar el indicador de hora
    const ind = document.getElementById('ultimo-actualizado');
    if(ind){
      const d = new Date();
      ind.textContent = 'Actualizado '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
  }catch(e){ /* silencioso — no alertar al operador */ }
}

let regDate = todayStr();
let regDraft = null; // {piscinas:{}, personal:{}}
let regSlug = null;

// Arma el historial de estados de UNA persona a partir de todos los reportes
// guardados de su campamento (para poder "arrastrar" el último estado conocido
// hacia adelante, en vez de resetear a "En campamento" cada día).
function personTimeline(campReportsMap, personId){
  const entries = [];
  for(const key in campReportsMap){
    const parts = key.split(':');
    const date = parts[2];
    const rep = campReportsMap[key];
    if(rep && rep.personal && rep.personal[personId] && rep.personal[personId].estado){
      entries.push({date, estado: rep.personal[personId].estado});
    }
  }
  entries.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return entries;
}
function estadoOnDate(timeline, date, fallback){
  let val = fallback;
  for(const e of timeline){
    if(e.date <= date) val = e.estado; else break;
  }
  return val;
}
// Cuenta cuántos días seguidos (terminando en "date") la persona ha estado LIBRE,
// usando el mismo arrastre. Limitado a 60 días hacia atrás por seguridad.
function libreStreak(timeline, date, fallback){
  // Sin ningún historial guardado no sabemos desde cuándo está libre esta
  // persona (ej. justo después de borrar el historial de prueba) — en ese
  // caso asumimos que recién quedó libre hoy, en vez de asumir 60 días.
  if(timeline.length===0) return fallback==='LIBRE' ? 1 : 0;
  const earliest = timeline[0].date;
  let count = 0;
  let d = new Date(date+'T00:00:00');
  for(let i=0;i<60;i++){
    const ds = d.toISOString().slice(0,10);
    const estado = estadoOnDate(timeline, ds, fallback);
    if(estado!=='LIBRE') break;
    count++;
    // No seguimos contando más atrás del primer día del que sí tenemos
    // registro real — antes de eso no hay forma de saberlo con certeza.
    if(ds <= earliest) break;
    d.setDate(d.getDate()-1);
  }
  return count;
}

// Igual que personTimeline/estadoOnDate pero para el conteo de motores
// DETENIDOS y su novedad, así una avería reportada se sigue mostrando
// (con su motivo) todos los días hasta que la marquen como reparada.
function piscinaTimeline(campReportsMap, piscinaId){
  const entries = [];
  for(const key in campReportsMap){
    const parts = key.split(':');
    const date = parts[2];
    const rep = campReportsMap[key];
    if(rep && rep.piscinas && rep.piscinas[piscinaId]){
      const v = rep.piscinas[piscinaId];
      entries.push({date, det: v.det||0, nov: v.nov||''});
    }
  }
  entries.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return entries;
}
function detOnDate(timeline, date){
  let det = 0, nov = '';
  for(const e of timeline){
    if(e.date <= date){ det = e.det; nov = e.nov; } else break;
  }
  return {det, nov};
}
function detenidoStreak(timeline, date){
  let count = 0;
  let d = new Date(date+'T00:00:00');
  for(let i=0;i<60;i++){
    const ds = d.toISOString().slice(0,10);
    const {det} = detOnDate(timeline, ds);
    if(det>0){ count++; d.setDate(d.getDate()-1); } else break;
  }
  return count;
}

async function renderRegistro(slug, locked){
  regSlug = slug;
  const host = locked ? document.getElementById('app') : document.getElementById('reg-body');
  host.innerHTML = '<div class="loading">Cargando registro…</div>';

  // PISCINAS y PERSONAL ya están cargados desde init() al abrir la app.
  // NO se recargan aquí para no borrar el reporte en curso si Supabase
  // devuelve datos vacíos o el reporte del día aún no se ha guardado.
  const campReportsMap = await sgetPrefixMap('report:'+slug+':');
  const key = 'report:'+slug+':'+regDate;
  let report = campReportsMap[key] || null;
  // Fallback: si sgetPrefixMap no devolvió nada para esta fecha, buscar directo
  if(!report){
    report = await sget(key);
    if(report && report.piscinas) report.piscinas = normalizePiscinasObj(report.piscinas);
  }
  const piscinas = PISCINAS[slug] || [];
  const personal = (PERSONAL[slug] || []).filter(p=>p.activo!==false);

  const reportLoadedFromFB = !!report; // true = tiene datos reales guardados en Firebase
  if(!report){
    report = {piscinas:{}, personal:{}};
  }
  // Si hay un borrador en memoria (datos que el usuario escribió y aún no guardó),
  // aplicarlos SIEMPRE encima del reporte de Firebase — así el auto-refresh no
  // borra lo que el operador tiene llenando aunque ya exista un reporte guardado.
  if(regDraft && (Object.keys(regDraft.piscinas||{}).length > 0 || Object.keys(regDraft.personal||{}).length > 0)){
    for(const [pid, vals] of Object.entries(regDraft.piscinas||{})){
      report.piscinas[pid] = {...(report.piscinas[pid]||{}), ...vals};
    }
    for(const [pid, vals] of Object.entries(regDraft.personal||{})){
      report.personal[pid] = {...(report.personal[pid]||{}), ...vals};
    }
  }
  {
    for(const p of piscinas){
      if(report.piscinas[p.id] && report.piscinas[p.id].apg===undefined) report.piscinas[p.id].apg = 0;
    }
  }
  // Los motores DETENIDOS y su novedad se "arrastran" del último reporte
  // guardado (igual que el estado del personal), en vez de resetear a 0 cada
  // día — así una falla sigue apareciendo (con su motivo) hasta que la
  // marquen como resuelta.
  const piscinaTimelines = {};
  const detStreaks = {};
  piscinas.forEach(p=>{
    const timeline = piscinaTimeline(campReportsMap, p.id);
    piscinaTimelines[p.id] = timeline;
    if(!report.piscinas[p.id]){
      const {det, nov} = detOnDate(timeline, regDate);
      const detBounded = Math.min(det, p.motores);
      report.piscinas[p.id] = { enc: Math.max(p.motores - detBounded, 0), apg: 0, det: detBounded, nov };
    }
    detStreaks[p.id] = report.piscinas[p.id].det>0 ? detenidoStreak(timeline, regDate) : 0;
  });
  // El estado de cada persona se "arrastra" del último día en que cambió,
  // en vez de resetear a "En campamento" cada vez que se abre una fecha nueva.
  const timelines = {};
  const streaks = {};
  personal.forEach(p=>{
    const fallback = ESTADO_PERSISTENTE_A_DIARIO[p.estado] || 'EN CAMPAMENTO';
    const timeline = personTimeline(campReportsMap, p.id);
    timelines[p.id] = timeline;
    const estadoHoy = (report.personal[p.id] && report.personal[p.id].estado) || estadoOnDate(timeline, regDate, fallback);
    report.personal[p.id] = {estado: estadoHoy};
    streaks[p.id] = estadoHoy==='LIBRE' ? libreStreak(timeline, regDate, fallback) : 0;
  });
  regDraft = report;

  let html = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="field">
          <label>Campamento</label>
          <div style="font-weight:700;color:#f8fafc;padding-top:5px">${esc(campName(slug))}</div>
        </div>
        <div class="field">
          <label>Fecha del reporte</label>
          <input type="date" id="reg-date" value="${regDate}">
          <button class="btn small secondary" style="margin-top:6px" onclick="onRegDateChange(document.getElementById('reg-date').value, '${slug}', ${locked})">Cargar fecha</button>
          <div style="margin-top:5px;font-size:0.75rem;font-weight:600;${reportLoadedFromFB ? 'color:#34d399' : 'color:#fbbf24'}">
            ${reportLoadedFromFB ? '✅ Reporte guardado encontrado' : '⚠️ Sin reporte guardado para esta fecha — valores son estimados'}
          </div>
        </div>
      </div>
      <p class="hint">El estado del personal y los motores "Detenidos" (con su novedad) se mantienen igual día tras día hasta que tú mismo los cambies (a "En campamento" u "Operativo"). Encendidos y Apagados sí se reinician cada día.</p>
    </div>

    <div class="card">
      <h2>💧 Piscinas y aireadores — ${piscinas.length} piscinas</h2>
      <div class="tw"><table><thead><tr>
        <th>Piscina</th>${slug==='PANTRUSKO2'?'<th>Sector</th>':''}<th>Motores instalados</th><th>Encendidos</th><th>Apagados</th><th>Detenidos</th><th>Cuadre</th><th>Novedad / daño a corregir</th>
      </tr></thead><tbody id="reg-piscinas-body">
        ${piscinas.length ? piscinas.map(p=>rowPiscina(p, report.piscinas[p.id], detStreaks[p.id], slug==='PANTRUSKO2', locked)).join('') : '<tr><td colspan="7" class="empty">No hay piscinas registradas. Agrégalas en Configuración.</td></tr>'}
      </tbody><tfoot id="reg-piscinas-foot"></tfoot></table></div>
    </div>

    <div class="card">
      <h2>🔧 Aireadores en taller (reparación mayor)</h2>
      <p class="sub">Motores que están fuera de las piscinas, en el taller, por una reparación mayor (no es lo mismo que "Detenidos" en una piscina).</p>
      <div class="row">
        <input type="number" id="taller-input" min="0" style="width:100px" value="${TALLER[slug]||0}">
        <button class="btn small" onclick="saveTaller('${slug}')">💾 Guardar</button>
      </div>
    </div>

    <div class="card">
      <h2>👷 Personal en campamento — ${personal.length} activos</h2>
      <div class="tw"><table><thead><tr>
        <th>Nombre</th><th>Cargo</th><th>Estado del día</th><th>Novedad</th>
      </tr></thead><tbody id="reg-personal-body">
        ${personal.length ? personal.map(p=>rowPersonal(p, report.personal[p.id], streaks[p.id])).join('') : '<tr><td colspan="4" class="empty">No hay personal registrado. Agrégalo en Configuración o abajo.</td></tr>'}
      </tbody></table></div>
      <div class="inline-form">
        <div class="field"><label>Nombre nuevo ingreso</label><input type="text" id="np-nombre" placeholder="Nombre completo"></div>
        <div class="field"><label>Cédula</label><input type="text" id="np-cedula" placeholder="0000000000" class="mini-in" style="width:110px"></div>
        <div class="field"><label>Cargo</label>
          <select id="np-cargo"><option>Operador</option><option>Mecánico</option><option>Abastecedor</option><option>Bodeguero</option></select>
        </div>
        <button class="btn small" onclick="addPersonalNuevo('${slug}')">+ Agregar personal</button>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn" onclick="saveReport('${slug}')">💾 Guardar reporte del día</button>
      ${locked ? '<button class="btn secondary" onclick="actualizarDatos()" style="margin-left:8px" title="Recarga personal y piscinas actualizados por el administrador">🔄 Actualizar datos</button><span id="ultimo-actualizado" style="margin-left:8px;font-size:0.75rem;color:#94a3b8;align-self:center"></span>' : ''}
      <span class="saved-flash" id="reg-saved">✓ Guardado</span>
    </div>
  `;
  host.innerHTML = html;
  updateRegTotals();
  // Restaurar posición de scroll si la guardamos antes de un auto-refresh
  if(window._savedScrollY != null){
    const sy = window._savedScrollY;
    window._savedScrollY = null;
    requestAnimationFrame(() => window.scrollTo(0, sy));
  }
}

function updateRegTotals(){
  const body = document.getElementById('reg-piscinas-body');
  const foot = document.getElementById('reg-piscinas-foot');
  if(!body || !foot) return;
  const rows = body.querySelectorAll('tr[data-ps]');
  if(!rows.length) return;
  let tMot=0, tEnc=0, tApg=0, tDet=0;
  rows.forEach(tr=>{
    const motEl = tr.querySelector('.ps-mot');
    tMot += parseInt(motEl ? (motEl.value !== undefined ? motEl.value : motEl.textContent) : 0) || 0;
    tEnc += parseInt(tr.querySelector('.ps-enc')?.value||0) || 0;
    tApg += parseInt(tr.querySelector('.ps-apg')?.value||0) || 0;
    tDet += parseInt(tr.querySelector('.ps-det')?.value||0) || 0;
  });
  const suma = tEnc+tApg+tDet;

  // detectar si hay columna Sector (PANTRUSKO2)
  const ths = body.closest('table')?.querySelectorAll('thead th');

    <td style="padding:7px 10px;text-align:center;color:#fbbf24;font-size:1rem">${tApg}</td>
    <td style="padding:7px 10px;text-align:center;color:#f87171;font-size:1rem">${tDet}</td>
    <td style="padding:7px 10px;text-align:center;color:${ok?'#34d399':'#f87171'}">${ok?'✓':'⚠'} ${suma}/${tMot}</td>

async function onMotoresChange(input, id){
  let v = parseInt(input.value||0); if(v<0) v=0; input.value=v;
  const p = (PISCINAS[regSlug]||[]).find(p=>p.id===id);
  if(p){
    const anterior = p.motores;
    if(v === anterior){ onCuadreInput(id); return; }
    const confirmado = confirm(
      '⚙️ CAMBIO DE MOTORES — Piscina ' + id + '\n\n' +
      'Valor anterior: ' + anterior + ' motores\n' +
      'Valor nuevo:    ' + v + ' motores\n\n' +
      '¿Confirmas este cambio?\n' +
      '(Este dato afecta el cálculo de cuadre para TODOS los reportes de ' + regSlug + ')'
    );
    if(!confirmado){
      input.value = anterior;
      return;
    }
    p.motores = v;
    const ok = await savePiscinasAll();
    if(!ok){
      p.motores = anterior;
      input.value = anterior;
      alert('❌ No se pudo guardar el cambio de motores. Verifica tu conexión e intenta de nuevo.');
      return;
    }
    console.log('✅ Motores piscina '+id+' cambiado: '+anterior+' → '+v+' ('+regSlug+')');
  }
  onCuadreInput(id);
}

async function saveRegistroPiscinas(personId){
  // ── PASO 1: capturar los valores del DOM ANTES de re-renderizar ──────────
  // Esto evita que los datos ingresados (enc/apg/det) se pierdan cuando
  // renderRegistro lee el reporte de Supabase y obtiene null (aún no guardado).
  const domPiscinas = {};
  document.querySelectorAll('#reg-piscinas-body tr[data-ps]').forEach(tr=>{
    const pid = tr.getAttribute('data-ps');
    domPiscinas[pid] = {
      enc: parseInt(tr.querySelector('.ps-enc')?.value||0)||0,
      apg: parseInt(tr.querySelector('.ps-apg')?.value||0)||0,
      det: parseInt(tr.querySelector('.ps-det')?.value||0)||0,
      nov: (tr.querySelector('.ps-nov')?.value||'').trim()
    };
  });
  const domPersonal = {};
  document.querySelectorAll('#reg-personal-body tr[data-pe]').forEach(tr=>{
    const pid = tr.getAttribute('data-pe');
    domPersonal[pid] = {
      estado: tr.querySelector('.pe-estado')?.value || 'EN CAMPAMENTO',
      novedad: (tr.querySelector('.pe-nov')?.value||'').trim()
    };
  });
  // Mezclar en regDraft para que renderRegistro los use si Supabase devuelve null
  if(!regDraft) regDraft = {piscinas:{}, personal:{}};
  Object.assign(regDraft.piscinas, domPiscinas);
  Object.assign(regDraft.personal, domPersonal);

async function actualizarDatos(){
  const btn = document.getElementById('btn-actualizar');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Actualizando…'; }
  try{
    // Capturar valores actuales del DOM antes de re-renderizar, para no perder lo escrito
    const domPiscinas = {};
    document.querySelectorAll('#reg-piscinas-body tr[data-ps]').forEach(tr=>{
      const pid = tr.getAttribute('data-ps');
      domPiscinas[pid] = {
        enc: parseInt(tr.querySelector('.ps-enc')?.value||0)||0,
        apg: parseInt(tr.querySelector('.ps-apg')?.value||0)||0,
        det: parseInt(tr.querySelector('.ps-det')?.value||0)||0,
        nov: (tr.querySelector('.ps-nov')?.value||'').trim()
      };
    });
    const domPersonal = {};
    document.querySelectorAll('#reg-personal-body tr[data-pe]').forEach(tr=>{
      const pid = tr.getAttribute('data-pe');
      domPersonal[pid] = {
        estado: tr.querySelector('.pe-estado')?.value || 'EN CAMPAMENTO',
        novedad: (tr.querySelector('.pe-nov')?.value||'').trim()
      };
    });
    const hayDatosDOM = Object.keys(domPiscinas).length > 0 || Object.keys(domPersonal).length > 0;

    const freshPersonal = await sget('roster:personal:all');
    const freshPiscinas = await sget('roster:piscinas:all');
    if(freshPersonal){
      PERSONAL = freshPersonal;
      for(const c of CAMPS){ if(!PERSONAL[c.slug]) PERSONAL[c.slug]=[]; }
    }
    if(freshPiscinas){
      PISCINAS = freshPiscinas;
      for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; }
    }
    // Preservar lo que el operador tenía escrito si no había guardado
    if(hayDatosDOM){
      if(!regDraft) regDraft = {piscinas:{}, personal:{}};
      Object.assign(regDraft.piscinas, domPiscinas);
      Object.assign(regDraft.personal, domPersonal);
    } else {
      regDraft = null;
    }
    render();
    const ind = document.getElementById('ultimo-actualizado');
    if(ind){
      const d = new Date();
      ind.textContent = 'Actualizado '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
  } catch(e){
    alert('No se pudo actualizar: '+e);
  } finally{
    const b2 = document.getElementById('btn-actualizar');
    if(b2){ b2.disabled=false; b2.textContent='🔄 Actualizar datos'; }
  }
}

async function saveReport(slug){
  const piscinas = {};
  const descuadradas = [];
  const sinNovedad = [];
  document.querySelectorAll('#reg-piscinas-body tr[data-ps]').forEach(tr=>{
    const id = tr.getAttribute('data-ps');
    const enc = parseInt(tr.querySelector('.ps-enc').value||0);
    const apg = parseInt(tr.querySelector('.ps-apg').value||0);
    const det = parseInt(tr.querySelector('.ps-det').value||0);
    const motEl = tr.querySelector('.ps-mot');
    const motores = parseInt(motEl.value !== undefined ? motEl.value : motEl.textContent || 0);
    const nov = tr.querySelector('.ps-nov').value.trim();
    piscinas[id] = {enc, apg, det, nov};
    if(enc+apg+det !== motores) descuadradas.push(id.replace(/^Pc/,'PC ')+' ('+(enc+apg+det)+'/'+motores+')');
    if(det>0 && !nov) sinNovedad.push(id.replace(/^Pc/,'PC '));
  });
  if(sinNovedad.length){
    alert('Estas piscinas tienen motores DETENIDOS pero les falta escribir la falla en "Novedad / daño a corregir":\n\n'+sinNovedad.join('\n')+'\n\nEscribe la falla antes de guardar.');
    return;
  }
  if(descuadradas.length){
    const seguir = confirm('Estas piscinas no cuadran (encendidos + apagados + detenidos ≠ motores instalados):\n\n'+descuadradas.join('\n')+'\n\n¿Guardar de todas formas?');
    if(!seguir) return;
  }
  const personal = {};
  const list = PERSONAL[slug] || [];
  let personalChanged = false;
  document.querySelectorAll('#reg-personal-body tr[data-pe]').forEach(tr=>{
    const id = tr.getAttribute('data-pe');
    const estado = tr.querySelector('.pe-estado').value;
    const nov = tr.querySelector('.pe-nov').value.trim();
    personal[id] = {estado, nov};
    const p = list.find(p=>p.id===id);
    if(p){
      const nuevoEstadoPersistente = ESTADO_DIARIO_A_PERSISTENTE[estado] || 'Trabajando';
      if(p.estado !== nuevoEstadoPersistente){ p.estado = nuevoEstadoPersistente; personalChanged = true; }
      if(p.novedad !== nov){ p.novedad = nov; personalChanged = true; }
      const nuevoActivo = estado !== 'RENUNCIA';
      if(p.activo !== nuevoActivo){ p.activo = nuevoActivo; personalChanged = true; }
    }
  });
  const report = {piscinas, personal, savedAt: new Date().toISOString()};
  const key = 'report:'+slug+':'+regDate;
  const saved = await sset(key, report);
  if(!saved){
    const detalle = window._lastSsetError ? '\n\n🔍 Detalle técnico:\n' + window._lastSsetError : '';
    alert('⚠️ Error al guardar el reporte. Verifica tu conexión e intenta de nuevo.' + detalle);
    return;
  }
  // Actualizar regDraft con los valores recién guardados.
  // Esto evita que un renderRegistro posterior (ej: al actualizar piscinas o auto-refresh)
  // use valores viejos del borrador si Firebase aún no ha propagado el nuevo reporte.
  regDraft = {piscinas, personal, savedAt: report.savedAt};
  if(personalChanged) await savePersonalAll();
  const flash = document.getElementById('reg-saved');
  if(flash){
    flash.textContent = '✓ Guardado — ' + fmtDate(regDate);
    flash.classList.add('show');
    setTimeout(()=>flash.classList.remove('show'), 2800);
  }
  // Verificación post-guardado: leer de Firebase 3s después para confirmar
  // que los datos de piscinas quedaron almacenados correctamente.
  const _savedPiscinas = Object.assign({}, piscinas);
  const _savedKey = key;
  const _savedSlug = slug;
  setTimeout(async ()=>{
    try{
      const check = await sget(_savedKey);
      if(!check){ console.error('⚠️ Verificación: reporte no encontrado en Firebase:', _savedKey); return; }
      const fbPiscinas = normalizePiscinasObj(check.piscinas || {});
      const mismatches = [];
      for(const id in _savedPiscinas){
        const sv = _savedPiscinas[id];
        const fb = fbPiscinas[id];
        if(!fb){
          mismatches.push('Piscina '+id+': datos NO encontrados en Firebase (enc='+sv.enc+', det='+sv.det+')');
        } else if(fb.enc !== sv.enc || fb.det !== sv.det || fb.apg !== sv.apg){
          mismatches.push('Piscina '+id+': guardado enc='+sv.enc+'/det='+sv.det+' pero Firebase tiene enc='+fb.enc+'/det='+fb.det);
        }
      }
      if(mismatches.length){
        console.error('⚠️ Verificación post-guardado FALLA para '+_savedSlug+' '+_savedKey+'\n'+mismatches.join('\n'));
        alert('⚠️ ADVERTENCIA: se detectaron diferencias entre lo guardado y lo almacenado en Firebase:\n\n'+mismatches.slice(0,5).join('\n')+'\n\nCaptura esta pantalla y envíala al administrador. Intenta guardar de nuevo.');
      } else {
        console.log('✅ Verificación post-guardado OK para '+_savedSlug+' ('+regDate+'): '+Object.keys(_savedPiscinas).length+' piscinas correctas');
      }
    }catch(e){ console.error('Error en verificación post-guardado:', e); }
  }, 3000);
}

let dashDate = todayStr();

async function fetchReports(date, slugs){
  const out = {};
  for(const slug of slugs){
    const campMap = await sgetPrefixMap('report:'+slug+':');
    let own = campMap['report:'+slug+':'+date] || null;
    // Fallback: si sgetPrefixMap no devolvió nada para esta fecha, buscar directo
    if(!own){
      own = await sget('report:'+slug+':'+date);
      if(own && own.piscinas) own.piscinas = normalizePiscinasObj(own.piscinas);
    }
    const personal = (PERSONAL[slug]||[]).filter(p=>p.activo!==false);
    const personalOut = {};
    personal.forEach(p=>{
      const fallback = ESTADO_PERSISTENTE_A_DIARIO[p.estado] || 'EN CAMPAMENTO';
      const timeline = personTimeline(campMap, p.id);
      const estado = (own && own.personal && own.personal[p.id] && own.personal[p.id].estado) || estadoOnDate(timeline, date, fallback);
      const nov = (own && own.personal && own.personal[p.id] && own.personal[p.id].nov) || p.novedad || '';
      personalOut[p.id] = {estado, nov};
    });
    const piscinasOut = {};
    (PISCINAS[slug]||[]).forEach(p=>{
      if(own && own.piscinas && own.piscinas[p.id]){
        piscinasOut[p.id] = own.piscinas[p.id];
      } else {
        const timeline = piscinaTimeline(campMap, p.id);
        const {det, nov} = detOnDate(timeline, date);
        const detBounded = Math.min(det, p.motores);
        piscinasOut[p.id] = { enc: Math.max(p.motores-detBounded,0), apg:0, det: detBounded, nov };
      }
    });
    out[slug] = { piscinas: piscinasOut, personal: personalOut, hasOwnReport: !!own };
  }
  return out;
}

  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Cargando resumen…</div>';

  const slugs = CAMPS.map(c=>c.slug);
  const reports = await fetchReports(dashDate, slugs);

  const DIESEL_GAL_H = 0.275;   // galones por aireador por hora
  const DIESEL_HORAS  = 10;      // horas de operación nocturna por defecto
  const SLUG_ELECTRICO = 'RECORCHOLIS2'; // aireadores eléctricos — excluir del diesel

  window.dieselHoras = window.dieselHoras || {}; // horas por slug, editables por el usuario
  window.dieselEncCache = {};                      // enc por slug para recalcular sin re-render
  let tMotores=0, tEnc=0, tDet=0, tPiscinas=0, tHa=0;
  let tEnCampo=0, tLibre=0, tPermiso=0, tVac=0, tRenuncia=0, tFalta=0;
  let tEncDiesel=0; // encendidos acumulados solo en campamentos con diesel (no eléctricos)
  let novedades = [];
  let personalHoy = [];
  let campRows = [];
  let mecanicosTotal=0, operadoresTotal=0;

  const filterSlugs = dashCampFilter==='ALL' ? slugs : [dashCampFilter];

    const rep = reports[slug];

    let cMotores=0, cEnc=0, cDet=0, cHa=0;

      cMotores += p.motores; if(p.ha) cHa += p.ha;
      const v = rep && rep.piscinas ? rep.piscinas[p.id] : null;
      const enc = v ? v.enc : p.motores;

      personalHoy.push({camp:slug, nombre:p.nombre, cargo:p.cargo, estado, nov: v?v.nov:''});

  });

/* ── RECÁLCULO EN TIEMPO REAL DE DIESEL ─────────────────── */
function recalcDiesel(slug){
  const DIESEL_GAL_H = 0.275;
  window.dieselHoras = window.dieselHoras || {};
  window.dieselEncCache = window.dieselEncCache || {};

  const h = parseFloat(document.getElementById('dsl-h-'+slug)?.value) || 10;
  window.dieselHoras[slug] = h;

  // Actualizar fila del campamento
  const cache = window.dieselEncCache[slug];
  if(cache){
    const noche = cache.enc * DIESEL_GAL_H * h;
    const s = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
    s('dsl-night-'+slug, `${noche.toFixed(0)} gal<span style="color:#78716c;font-weight:400"> / ${(noche*3.785).toFixed(0)}L</span>`);
    s('dsl-lun-'+slug,   `${(noche*3).toFixed(0)} gal<span style="color:#78716c"> / ${(noche*3*3.785).toFixed(0)}L</span>`);
    s('dsl-jue-'+slug,   `${(noche*4).toFixed(0)} gal<span style="color:#78716c"> / ${(noche*4*3.785).toFixed(0)}L</span>`);
    s('dsl-sem-'+slug,   `${(noche*7).toFixed(0)} gal<span style="color:#78716c;font-weight:400"> / ${(noche*7*3.785).toFixed(0)}L</span>`);
  }

  // Recalcular TOTAL sumando todos los campamentos diesel
  let total = 0;
  Object.entries(window.dieselEncCache).forEach(([sl, d])=>{
    if(!d.esDiesel) return;
    total += d.enc * DIESEL_GAL_H * (window.dieselHoras[sl] || 10);
  });

  const s = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  s('dsl-tot-night', `${total.toFixed(0)} gal / ${(total*3.785).toFixed(0)}L`);
  s('dsl-tot-lun',   `${(total*3).toFixed(0)} gal / ${(total*3*3.785).toFixed(0)}L`);
  s('dsl-tot-jue',   `${(total*4).toFixed(0)} gal / ${(total*4*3.785).toFixed(0)}L`);
  s('dsl-tot-sem',   `${(total*7).toFixed(0)} gal / ${(total*7*3.785).toFixed(0)}L`);

  // Actualizar cards de resumen
  s('dsl-card-night-val', `${total.toFixed(0)} gal`);
  s('dsl-card-night-lit', `${(total*3.785).toFixed(0)} litros`);
  s('dsl-card-lun-val',   `${(total*3).toFixed(0)} gal`);
  s('dsl-card-lun-lit',   `${(total*3*3.785).toFixed(0)} litros`);
  s('dsl-card-jue-val',   `${(total*4).toFixed(0)} gal`);
  s('dsl-card-jue-lit',   `${(total*4*3.785).toFixed(0)} litros`);
  s('dsl-card-sem-sub',   `Lun ${(total*3).toFixed(0)} + Jue ${(total*4).toFixed(0)}`);
  s('dsl-card-sem-val',   `${(total*7).toFixed(0)} gal`);
  s('dsl-card-sem-lit',   `${(total*7*3.785).toFixed(0)} litros`);
}

async function generarDieselReport(){
  const tipo  = document.getElementById('dr-tipo').value;
  const res   = document.getElementById('dr-resultado');
  const btn   = document.getElementById('dr-btn');
  btn.disabled = true; btn.textContent = '⏳ Cargando...';
  res.innerHTML = '';

  // Construir lista de fechas
  let dates = [];
  if(tipo === 'diario'){
    const f = document.getElementById('dr-fecha').value;
    if(!f){ alert('Selecciona una fecha'); btn.disabled=false; btn.textContent='⚡ Generar'; return; }
    dates = [f];
  } else if(tipo === 'semanal'){
    const f = document.getElementById('dr-fecha').value;
    if(!f){ alert('Selecciona una fecha'); btn.disabled=false; btn.textContent='⚡ Generar'; return; }
    // Semana lun-dom que contiene la fecha
    const d = new Date(f+'T12:00:00');
    const dow = d.getDay(); // 0=dom,1=lun,...
    const lun = new Date(d); lun.setDate(d.getDate() - ((dow+6)%7));
    for(let i=0;i<7;i++){
      const dd = new Date(lun); dd.setDate(lun.getDate()+i);
      dates.push(dd.toISOString().slice(0,10));
    }
  } else {
    const m = document.getElementById('dr-mes').value;
    if(!m){ alert('Selecciona un mes'); btn.disabled=false; btn.textContent='⚡ Generar'; return; }
    const [yr,mo] = m.split('-').map(Number);
    const dias = new Date(yr, mo, 0).getDate();
    for(let i=1;i<=dias;i++) dates.push(`${yr}-${String(mo).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
  }

  // Campamentos diesel
  const dieselCamps = CAMPS.filter(c=>c.slug !== SLUG_ELECTRICO);
  const DIESEL_GAL_H = 0.275, DIESEL_HORAS = 10;

  // Cargar reportes: para cada camp y cada fecha (con timeout de 8s por llamada)
  const sgetTimeout = (key, ms=8000) => Promise.race([
    sget(key),
    new Promise(r => setTimeout(()=>r(null), ms))
  ]);

  const allData = {}; // allData[slug][date] = {enc, sinDatos}
  try {
    await Promise.all(dieselCamps.map(async camp=>{
      allData[camp.slug] = {};
      await Promise.all(dates.map(async dt=>{
        let rep = null;
        try { rep = await sgetTimeout('report:'+camp.slug+':'+dt); } catch(e){ rep = null; }
        const piscinas = PISCINAS[camp.slug] || [];
        let enc = 0; let sinDatos = !rep;
        piscinas.forEach(p=>{
          const v = rep && rep.piscinas ? rep.piscinas[p.id] : null;
          enc += v ? v.enc : p.motores;
        });
        allData[camp.slug][dt] = {enc, sinDatos};
      }));
    }));
  } catch(e) {
    res.innerHTML = `<p style="color:#f87171">❌ Error al cargar datos: ${e.message}. Intenta de nuevo.</p>`;
    btn.disabled=false; btn.textContent='⚡ Generar'; return;
  }

  // Calcular totales por día y por camp
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const fmtD = d => { const o=new Date(d+'T12:00:00'); return dias[o.getDay()]+' '+d.slice(5).replace('-','/'); };

  // Totales por campamento (suma de noches)
  const campTotals = {}; // campTotals[slug] = {gal: X}
  dieselCamps.forEach(c=>{ campTotals[c.slug]={gal:0}; });
  let diasSinDatos = 0;
  dates.forEach(dt=>{
    let hayAlgunSinDato = false;
    dieselCamps.forEach(c=>{
      const d = allData[c.slug][dt] || {enc:0, sinDatos:true};
      if(d.sinDatos) hayAlgunSinDato = true;
      const h = window.dieselHoras?.[c.slug] || DIESEL_HORAS;
      campTotals[c.slug].gal += d.enc * DIESEL_GAL_H * h;
    });
    if(hayAlgunSinDato) diasSinDatos++;
  });

  // Construir tabla
  const noches = dates.length;
  let html = `<div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:0.8rem">
      <thead>
        <tr style="color:#a16207;font-size:0.68rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #292524">
          <th style="text-align:left;padding:4px 8px">Fecha</th>
          ${dieselCamps.map(c=>`<th style="text-align:right;padding:4px 8px">${esc(campName(c.slug))}<br><span style="font-size:0.6rem;color:#57534e">gal / litros</span></th>`).join('')}
          <th style="text-align:right;padding:4px 8px;color:#fbbf24">TOTAL NOCHE</th>
        </tr>
      </thead>
      <tbody>`;

  let grandTotal = 0;
  dates.forEach(dt=>{
    let rowTotal = 0;
    const cells = dieselCamps.map(c=>{
      const d = allData[c.slug][dt] || {enc:0, sinDatos:true};
      const h = window.dieselHoras?.[c.slug] || DIESEL_HORAS;
      const gal = d.enc * DIESEL_GAL_H * h;
      rowTotal += gal;
      const style = d.sinDatos ? 'color:#57534e;font-style:italic' : 'color:#e2e8f0';
      const txt = d.sinDatos ? `<span title="Sin reporte guardado">—</span>` : `${gal.toFixed(0)}<span style="color:#78716c"> / ${(gal*3.785).toFixed(0)}L</span>`;
      return `<td style="text-align:right;padding:4px 8px;${style}">${txt}</td>`;
    }).join('');
    grandTotal += rowTotal;
    const esLun = new Date(dt+'T12:00:00').getDay()===1;
    const esJue = new Date(dt+'T12:00:00').getDay()===4;
    const rowStyle = (esLun||esJue) ? 'background:#1c1a0a;' : '';
    const tag = esLun ? ' <span style="color:#ca8a04;font-size:0.65rem">📅LUN</span>' : esJue ? ' <span style="color:#ca8a04;font-size:0.65rem">📅JUE</span>' : '';
    html += `<tr style="border-bottom:1px solid #1c1917;${rowStyle}">
      <td style="padding:4px 8px;color:#94a3b8">${fmtD(dt)}${tag}</td>
      ${cells}
      <td style="text-align:right;padding:4px 8px;color:#fbbf24;font-weight:700">${rowTotal>0?rowTotal.toFixed(0)+' gal':'—'}</td>
    </tr>`;
  });

  // Fila totales
  html += `<tr style="border-top:2px solid #ca8a04;font-weight:700;background:#1c1007">
    <td style="padding:6px 8px;color:#fbbf24">TOTAL (${noches} noches)</td>
    ${dieselCamps.map(c=>`<td style="text-align:right;padding:6px 8px;color:#fbbf24">${campTotals[c.slug].gal.toFixed(0)} gal<span style="color:#a16207;font-weight:400"> / ${(campTotals[c.slug].gal*3.785).toFixed(0)}L</span></td>`).join('')}
    <td style="text-align:right;padding:6px 8px;color:#4ade80;font-size:1rem">${grandTotal.toFixed(0)} gal / ${(grandTotal*3.785).toFixed(0)}L</td>
  </tr>`;
  html += `</tbody></table></div>`;

  // Resumen ejecutivo
  const nochesConDatos = noches - diasSinDatos;
  const promedioNoche = nochesConDatos > 0 ? grandTotal / nochesConDatos : 0;
  if(grandTotal === 0){
    html += `<div style="margin-top:12px;padding:16px;background:#0f1a0a;border-radius:8px;text-align:center;color:#78716c">
      <div style="font-size:1.5rem;margin-bottom:6px">📭</div>
      <strong>Sin reportes guardados para este período</strong><br>
      <span style="font-size:0.8rem">Cuando los operadores guarden sus reportes diarios, aquí aparecerá el consumo real.</span>
    </div>`;
  } else {
    html += `<div style="margin-top:12px;padding:12px;background:#0f1a0a;border-radius:8px;font-size:0.82rem;color:#a16207">
      <strong style="color:#fbbf24">Resumen:</strong>
      Promedio por noche: <strong style="color:#fbbf24">${promedioNoche.toFixed(0)} gal</strong> |
      Total del período: <strong style="color:#4ade80">${grandTotal.toFixed(0)} gal / ${(grandTotal*3.785).toFixed(0)} litros</strong>
      ${noches===7 ? ` | Proyectado mes (30d): <strong style="color:#94a3b8">${(promedioNoche*30).toFixed(0)} gal</strong>` : ''}
    </div>`;
  }
  if(diasSinDatos > 0){
    html += `<p style="font-size:0.7rem;color:#57534e;margin-top:8px">⚠ ${diasSinDatos} día(s) sin reporte guardado aparecen como "—" y no se incluyen en el promedio.</p>`;
  }

  res.innerHTML = html;
  btn.disabled = false; btn.textContent = '⚡ Generar';
}

}

async function collectRangeDates(start, end){
  const dates=[]; let d=new Date(start+'T00:00:00'); const e=new Date(end+'T00:00:00');
  while(d<=e){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return dates;
}

async function exportAsistencia(){
  const btn = document.getElementById('exp-btn');
  try{
    const start = document.getElementById('exp-start').value;
    const end = document.getElementById('exp-end').value;
    const campSel = document.getElementById('exp-camp').value;
    if(!start || !end || start>end){ alert('Revisa el rango de fechas'); return; }
    if(btn){ btn.disabled = true; btn.textContent = '⏳ Generando...'; }

    if(typeof ExcelJS === 'undefined') throw new Error('La librería ExcelJS no cargó (revisa tu conexión a internet).');

    const dates = await collectRangeDates(start, end);
    const slugs = campSel==='ALL' ? CAMPS.map(c=>c.slug) : [campSel];

    // Una sola petición por campamento (trae todos sus reportes de una vez),
    // en vez de una petición por cada combinación de campamento y día.
    const reportsBySlug = {};
    for(const slug of slugs){
      reportsBySlug[slug] = await sgetPrefixMap('report:'+slug+':');
    }

    // Colores de fondo por estado del día
    const FILLS = {
      'EN CAMPAMENTO': 'FFB7E1CD', // verde agua
      'LIBRE': 'FFFF0000',         // rojo
      'PERMISO MEDICO': 'FFFFEB3B',// amarillo
      'RENUNCIA': 'FFFFFFFF'       // blanco
    };

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Asistencia');
    const header = ['CAMPAMENTO','NOMBRES','#CEDULA','FECHA INGRESO','CARGO','NOVEDADES', ...dates.map(fmtDate)];
    const headerRow = ws.addRow(header);
    headerRow.font = { bold: true };

    let dataRows = 0;
    const THIN = { style: 'thin', color: {argb:'FF000000'} };
    const BORDER_ALL = { top: THIN, left: THIN, bottom: THIN, right: THIN };
    header.forEach((_,i)=>{ headerRow.getCell(i+1).border = BORDER_ALL; });

    slugs.forEach(slug=>{
      const personal = PERSONAL[slug] || [];
      const campReports = reportsBySlug[slug] || {};
      personal.forEach(p=>{
        const fallback = p.activo===false ? 'RENUNCIA' : (ESTADO_PERSISTENTE_A_DIARIO[p.estado] || 'EN CAMPAMENTO');
        const timeline = personTimeline(campReports, p.id);
        const estados = dates.map(date => estadoOnDate(timeline, date, fallback));
        const rowValues = [campName(slug), p.nombre, p.cedula||'', p.fechaIngreso?fmtDate(p.fechaIngreso):'', p.cargo, p.novedad||'',
          ...estados.map(estado => ESTADO_CODE[estado] !== undefined ? ESTADO_CODE[estado] : '')];
        const row = ws.addRow(rowValues);
        rowValues.forEach((_,i)=>{ row.getCell(i+1).border = BORDER_ALL; });
        estados.forEach((estado, i)=>{
          const cell = row.getCell(7 + i); // A-F son fijas (1-6), las fechas empiezan en la 7
          const argb = FILLS[estado];
          if(argb){
            cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb} };
          }
        });
        dataRows++;
      });
    });

    if(dataRows===0){ alert('No hay personal para exportar con esos filtros.'); return; }

    ws.columns.forEach((c,i)=>{ c.width = i<6 ? 20 : 8; });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Asistencia_Aireadores_' + start + '_a_' + end + '.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){
    console.error('export failed', e);
    alert('No se pudo generar el Excel.\n\nDetalle: ' + (e && (e.message||String(e))));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '⬇️ Exportar a Excel'; }
  }
}

async function exportEficiencia(){
  const btn = document.getElementById('efi-btn');
  try{
    const date = document.getElementById('efi-date').value;
    const campSel = document.getElementById('efi-camp').value;
    if(!date){ alert('Elige una fecha'); return; }
    if(btn){ btn.disabled = true; btn.textContent = '⏳ Generando...'; }
    if(typeof ExcelJS === 'undefined') throw new Error('La librería ExcelJS no cargó (revisa tu conexión a internet).');

    const slugs = campSel==='ALL' ? CAMPS.map(c=>c.slug) : [campSel];
    const reports = await fetchReports(date, slugs); // reutiliza el mismo arrastre de detenidos que el resto de la app

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Eficiencia');
    const header = ['CAMPAMENTO','PISCINA','OPERADOR','TIPO','HECTÁREAS','MOTORES INSTALADOS','ENCENDIDOS','APAGADOS','DETENIDOS','% OPERATIVIDAD'];
    const headerRow = ws.addRow(header);
    headerRow.font = { bold: true };
    const THIN = { style: 'thin', color: {argb:'FF000000'} };
    const BORDER_ALL = { top: THIN, left: THIN, bottom: THIN, right: THIN };
    header.forEach((_,i)=>{ headerRow.getCell(i+1).border = BORDER_ALL; });

    // Mapa inverso: slug → { piscinaId → nombre del operador asignado }
    const piscinaOperador = {};
    for(const slug of slugs){
      piscinaOperador[slug] = {};
      for(const p of (PERSONAL[slug] || [])){
        for(const pid of (p.piscinas || [])){
          piscinaOperador[slug][pid] = p.nombre;
        }
      }
    }

    let gMot=0, gEnc=0, gApg=0, gDet=0, gHa=0, dataRows=0;

    slugs.forEach(slug=>{
      const piscinas = PISCINAS[slug] || [];
      const rep = reports[slug] || {piscinas:{}};
      let cMot=0, cEnc=0, cApg=0, cDet=0, cHa=0;
      piscinas.forEach(p=>{
        const v = rep.piscinas[p.id] || {enc:p.motores, apg:0, det:0};
        const pct = p.motores ? (v.enc/p.motores*100) : 0;
        const label = (p.tipo==='PC'?'PC ':'PS ')+p.id.replace(/^Pc/,'');
        const operador = (piscinaOperador[slug]&&piscinaOperador[slug][p.id]) || '';
        const row = ws.addRow([campName(slug), label, operador, p.tipo, p.ha||0, p.motores, v.enc, v.apg||0, v.det, pct/100]);
        row.getCell(10).numFmt = '0.0%';
        for(let i=1;i<=10;i++) row.getCell(i).border = BORDER_ALL;
        cMot+=p.motores; cEnc+=v.enc; cApg+=v.apg||0; cDet+=v.det; cHa+=p.ha||0;
        dataRows++;
      });
      if(piscinas.length){
        const pct = cMot ? (cEnc/cMot*100) : 0;
        const totalRow = ws.addRow([campName(slug)+' — TOTAL', '', '', '', cHa, cMot, cEnc, cApg, cDet, pct/100]);
        totalRow.font = { bold: true };
        totalRow.getCell(10).numFmt = '0.0%';
        for(let i=1;i<=10;i++) totalRow.getCell(i).border = BORDER_ALL;
        gMot+=cMot; gEnc+=cEnc; gApg+=cApg; gDet+=cDet; gHa+=cHa;
      }
    });

    if(dataRows===0){ alert('No hay piscinas para exportar con esos filtros.'); return; }

    if(slugs.length>1){
      const pct = gMot ? (gEnc/gMot*100) : 0;
      const grandRow = ws.addRow(['TOTAL GENERAL', '', '', '', gHa, gMot, gEnc, gApg, gDet, pct/100]);
      grandRow.font = { bold: true };
      grandRow.getCell(10).numFmt = '0.0%';
      grandRow.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE2E8F0'} };
      for(let i=1;i<=10;i++) grandRow.getCell(i).border = BORDER_ALL;
    }

    // Anchos: CAMPAMENTO=18, PISCINA=10, OPERADOR=28, TIPO=7, resto=12
    ws.columns.forEach((c,i)=>{ c.width = i===0?18:i===1?10:i===2?28:i===3?7:12; });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Eficiencia_Aireadores_' + date + '.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){
    console.error('export eficiencia failed', e);
    alert('No se pudo generar el Excel.\n\nDetalle: ' + (e && (e.message||String(e))));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '⬇️ Exportar a Excel'; }
  }
}

async function verReporteEspecifico(){
  const slug = mantCampSel || configCampSel || CAMPS[0]?.slug;
  const date = document.getElementById('mant-date').value;
  const pre = document.getElementById('mant-view');
  pre.style.display = 'block';

  if(!val){ pre.textContent = 'No hay ningún reporte guardado para '+campName(slug)+' el '+fmtDate(date)+'.'; return; }
  // Traduce los IDs de personal a nombres para que sea legible
  const personal = PERSONAL[slug]||[];
  const legible = { piscinas: val.piscinas, personal: {} };
  for(const id in (val.personal||{})){
    const p = personal.find(p=>p.id===id);
    legible.personal[(p?p.nombre:id)] = val.personal[id];
  }
  pre.textContent = 'report:'+slug+':'+date+'\n\n'+JSON.stringify(legible, null, 2);

async function borrarReporteEspecifico(){
  const slug = mantCampSel || configCampSel || CAMPS[0]?.slug;
  const date = document.getElementById('mant-date').value;
  if(!confirm('¿Borrar el reporte de '+campName(slug)+' del '+fmtDate(date)+'? Esta acción no se puede deshacer.')) return;
  // PUT null → Firebase elimina el nodo completamente (no deja registro vacío)
  const ok = await sset('report:'+slug+':'+date, null);
  const pre = document.getElementById('mant-view');
  pre.style.display = 'block';
  pre.textContent = ok ? '✅ Reporte borrado correctamente.\n\nAl abrir esa fecha en el Registro el operador verá "⚠️ Sin reporte guardado" y podrá ingresar los datos nuevamente.' : '❌ No se pudo borrar, intenta de nuevo.';
}
async function limpiarHistorialReportes(){
  if(!confirm('¿Seguro que quieres borrar TODO el historial de reportes diarios de TODOS los campamentos? Esta acción no se puede deshacer.')) return;
  const btn = document.getElementById('mant-btn');
  const status = document.getElementById('mant-status');
  try{
    if(btn){ btn.disabled = true; btn.textContent = '⏳ Borrando...'; }
    const keys = await slist('report:');
    let ok = 0, fail = 0;
    for(const k of keys){
      const r = await sset(k, {piscinas:{}, personal:{}});
      if(r) ok++; else fail++;
      if(status) status.textContent = `Progreso: ${ok+fail}/${keys.length}`;
    }
    if(status) status.textContent = `Listo. ${ok} reportes limpiados${fail?', '+fail+' fallaron (reintenta si es necesario)':''} de ${keys.length} encontrados.`;
  }catch(e){
    console.error('limpiarHistorialReportes failed', e);
    alert('No se pudo completar la limpieza.\n\nDetalle: '+(e && (e.message||String(e))));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '🗑️ Borrar todo el historial de reportes'; }
  }
}

async function savePiscinaRow(i){
  const list = PISCINAS[configCampSel];
  const id = document.getElementById('ps-id-'+i).value.trim();
  const tipo = document.getElementById('ps-tipo-'+i).value;
  const motores = parseInt(document.getElementById('ps-mot-'+i).value||0);
  const haRaw = document.getElementById('ps-ha-'+i).value;
  const ha = haRaw==='' ? null : parseFloat(haRaw);
  // Preservar campos extra (ej: sector en PANTRUSKO2)
  list[i] = Object.assign({}, list[i], {id, tipo, motores, ha});
  const status = document.getElementById('ps-status-'+i);
  if(status){ status.textContent='⏳'; status.style.color='#facc15'; status.style.opacity='1'; }
  const ok = await savePiscinasAll();
  if(!ok){
    if(status){ status.textContent='❌'; status.style.color='#f87171'; setTimeout(()=>{ status.style.opacity='0'; },3000); }
    alert('❌ No se pudo guardar en Firebase. Revisa tu conexión e intenta de nuevo.');
    const fresh = await sget('roster:piscinas:all');
    if(fresh){ PISCINAS = fresh; for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; } }
    renderConfigPiscinas();
    return;
  }
  // Verificación post-guardado: releer de Firebase y confirmar que el valor quedó correcto
  await new Promise(r=>setTimeout(r,1500));
  const fbData = await sget('roster:piscinas:all');
  if(fbData){
    const fbList = fbData[configCampSel] || [];
    const fbP = Array.isArray(fbList)
      ? fbList.find(p=>p && p.id===id)
      : Object.values(fbList).find(p=>p && p.id===id);
    if(!fbP){
      if(status){ status.textContent='⚠'; status.style.color='#f87171'; setTimeout(()=>{ status.style.opacity='0'; },5000); }
      alert('⚠️ ADVERTENCIA: Firebase no encuentra la piscina "'+id+'" en '+configCampSel+' después de guardar. Contacta al administrador.');
      return;
    }
    if(fbP.motores !== motores){
      if(status){ status.textContent='⚠'; status.style.color='#f87171'; setTimeout(()=>{ status.style.opacity='0'; },5000); }
      alert('⚠️ ADVERTENCIA: Se guardó motores='+motores+' pero Firebase tiene motores='+fbP.motores+' para piscina "'+id+'" en '+configCampSel+'.\n\nEl guardado no persistió correctamente. Intenta de nuevo.');
      // Recargar datos reales de Firebase
      PISCINAS = fbData; for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; }
      renderConfigPiscinas();
      return;
    }
    // Actualizar PISCINAS en memoria con lo que realmente tiene Firebase
    PISCINAS = fbData; for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; }
  }
  if(status){ status.textContent='✓ '+motores+' motores'; status.style.color='#34d399'; setTimeout(()=>{ status.style.opacity='0'; },3000); }
}
async function leerPiscinasFB(){
  const btn = document.getElementById('btn-leer-fb');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Leyendo...'; }
  const fbData = await sget('roster:piscinas:all');
  if(btn){ btn.disabled=false; btn.textContent='🔍 Leer Firebase'; }
  if(!fbData){ alert('❌ No se pudo leer Firebase. Verifica tu conexión.'); return; }
  PISCINAS = fbData;
  for(const c of CAMPS){ if(!PISCINAS[c.slug]) PISCINAS[c.slug]=[]; }
  renderConfigPiscinas();
  const list = PISCINAS[configCampSel] || [];
  const ps7 = Array.isArray(list)
    ? list.find(p=>p && p.id==='7')
    : Object.values(list).find(p=>p && p.id==='7');
  const pc7 = Array.isArray(list)
    ? list.find(p=>p && p.id==='Pc7')
    : Object.values(list).find(p=>p && p.id==='Pc7');
  let msg = '✅ Datos recargados desde Firebase para '+campName(configCampSel)+'.\n\n';
  if(ps7) msg += 'PS 7  → motores: '+ps7.motores+'\n';
  if(pc7) msg += 'Pc7   → motores: '+pc7.motores+'\n';
  if(!ps7 && !pc7) msg += '(Sin piscinas 7 o Pc7 en este campamento)';
  alert(msg);
}
async function deletePiscinaRow(i){
  if(!confirm('¿Eliminar esta piscina del registro?')) return;
  const list = PISCINAS[configCampSel];
  list.splice(i,1);
  await savePiscinasAll();
  renderConfigPiscinas();
}
async function addPiscinaRow(){
  const id = document.getElementById('np-ps-id').value.trim();
  const tipo = document.getElementById('np-ps-tipo').value;
  const motores = parseInt(document.getElementById('np-ps-mot').value||0);
  const haRaw = document.getElementById('np-ps-ha').value;
  const ha = haRaw==='' ? null : parseFloat(haRaw);
  if(!id){ alert('Escribe el identificador de la piscina'); return; }
  const list = PISCINAS[configCampSel] || [];
  list.push({id, tipo, motores, ha});
  PISCINAS[configCampSel] = list;
  await savePiscinasAll();
  renderConfigPiscinas();
}

function renderConfigPersonal(){
  const body = document.getElementById('config-body');
  const list = PERSONAL[configCampSel] || [];
  const ESTADOS = ['Trabajando','Libre','Permiso médico','Vacaciones','Renunció'];
  const piscinasCamp = PISCINAS[configCampSel] || [];
  body.innerHTML = `
    <div class="card">
      <div class="row"><div class="field"><label>Campamento</label>${campSelectorHtml('cfg-pe-camp','onConfigPeCampChange')}</div></div>
      <h2>👷 Personal de ${esc(campName(configCampSel))} (${list.filter(p=>p.activo!==false).length} activos de ${list.length})</h2>
      <div class="tw"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Fecha ingreso</th><th>Estado</th><th>Novedad</th><th>Piscinas</th><th></th></tr></thead><tbody>
        ${list.map((p,i)=>`<tr data-i="${i}">
          <td><input type="text" class="nov-in" style="width:180px" value="${esc(p.nombre)}" id="pe-nom-${i}"></td>
          <td><input type="text" class="mini-in" style="width:110px" value="${esc(p.cedula||'')}" id="pe-ced-${i}"></td>
          <td><select id="pe-cargo-${i}"><option ${p.cargo==='Operador'?'selected':''}>Operador</option><option ${p.cargo==='Mecánico'?'selected':''}>Mecánico</option><option ${p.cargo==='Abastecedor'?'selected':''}>Abastecedor</option><option ${p.cargo==='Bodeguero'?'selected':''}>Bodeguero</option></select></td>
          <td><input type="date" id="pe-fi-${i}" value="${p.fechaIngreso||''}"></td>
          <td><select id="pe-estado-${i}">${ESTADOS.map(e=>`<option ${((p.estado||(p.activo===false?'Renunció':'Trabajando'))===e)?'selected':''}>${e}</option>`).join('')}</select></td>
          <td><input type="text" class="nov-in" style="width:160px" value="${esc(p.novedad||'')}" id="pe-nov-${i}"></td>
          <td><button class="btn small secondary" onclick="togglePiscinasConfig(${i})">${(p.piscinas||[]).length} 🖊️</button></td>
          <td><button class="btn small" onclick="savePersonalRow(${i})">💾</button> <button class="btn small danger" onclick="deletePersonalRow(${i})">✕</button></td>
        </tr>
        <tr id="piscinas-cfg-${i}" style="display:none"><td colspan="8">${renderPiscinasCheckboxes(piscinasCamp, p.piscinas||[], i)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="inline-form">
        <div class="field"><label>Nombre</label><input type="text" id="np-pe-nombre" style="width:200px"></div>
        <div class="field"><label>Cédula</label><input type="text" id="np-pe-cedula" style="width:130px"></div>
        <div class="field"><label>Cargo</label><select id="np-pe-cargo"><option>Operador</option><option>Mecánico</option><option>Abastecedor</option><option>Bodeguero</option></select></div>
        <div class="field"><label>Fecha ingreso</label><input type="date" id="np-pe-fi" value="${todayStr()}"></div>
        <button class="btn small" onclick="addPersonalRow()">+ Agregar personal</button>
      </div>
    </div>`;
}
function renderPiscinasCheckboxes(piscinasCamp, assignedIds, key, saveFn){
  saveFn = saveFn || 'saveConfigPiscinas';
  const groups = {};
  piscinasCamp.forEach(p=>{
    const g = p.sector || '__nogroup__';
    groups[g] = groups[g] || [];
    groups[g].push(p);
  });
  const groupKeys = Object.keys(groups);
  const body = groupKeys.map(g=>{
    const items = groups[g].map(p=>{
      const label = (p.tipo==='PC'?'PC ':'PS ')+p.id.replace(/^Pc/,'');
      const checked = assignedIds.includes(p.id) ? 'checked' : '';
      return `<label style="display:inline-flex;align-items:center;gap:3px;margin:3px 8px 3px 0;font-size:0.78rem;color:#cbd5e1">
        <input type="checkbox" class="pisc-chk-${key}" value="${esc(p.id)}" ${checked}> ${label} (${p.motores})
      </label>`;
    }).join('');
    return g==='__nogroup__' ? items : `<div style="margin-top:6px"><strong style="color:#e2e8f0;font-size:0.8rem">${esc(g)}</strong><br>${items}</div>`;
  }).join('');
  return `<div style="background:#0f172a;border-radius:8px;padding:10px">
    ${body || '<span class="sub">Este campamento no tiene piscinas configuradas.</span>'}
    <div style="margin-top:8px"><button class="btn small" onclick="${saveFn}('${key}')">💾 Guardar piscinas asignadas</button></div>
  </div>`;
}
function togglePiscinasConfig(i){
  const row = document.getElementById('piscinas-cfg-'+i);
  if(row) row.style.display = row.style.display==='none' ? 'table-row' : 'none';
}
async function saveConfigPiscinas(i){
  const checks = document.querySelectorAll('.pisc-chk-'+i+':checked');
  const ids = Array.from(checks).map(c=>c.value);
  const p = (PERSONAL[configCampSel]||[])[i];
  if(!p) return;
  p.piscinas = ids;
  await savePersonalAll();
  renderConfigPersonal();
}
function onConfigPeCampChange(v){ configCampSel=v; renderConfigPersonal(); }
async function savePersonalRow(i){
  const list = PERSONAL[configCampSel];
  const p = list[i];
  p.nombre = document.getElementById('pe-nom-'+i).value.trim();
  p.cedula = document.getElementById('pe-ced-'+i).value.trim();
  p.cargo = document.getElementById('pe-cargo-'+i).value;
  p.fechaIngreso = document.getElementById('pe-fi-'+i).value;
  p.estado = document.getElementById('pe-estado-'+i).value;
  p.novedad = document.getElementById('pe-nov-'+i).value.trim();
  p.activo = p.estado !== 'Renunció';
  await savePersonalAll();
  renderConfigPersonal();
}
async function deletePersonalRow(i){
  if(!confirm('¿Eliminar a esta persona del registro? (Si solo renunció, mejor cambia su Estado a "Renunció" para conservar el historial)')) return;
  const list = PERSONAL[configCampSel];
  list.splice(i,1);
  await savePersonalAll();
  renderConfigPersonal();
}
async function addPersonalRow(){
  const nombre = document.getElementById('np-pe-nombre').value.trim();
  const cedula = document.getElementById('np-pe-cedula').value.trim();
  const cargo = document.getElementById('np-pe-cargo').value;
  const fechaIngreso = document.getElementById('np-pe-fi').value;
  if(!nombre){ alert('Escribe el nombre de la persona'); return; }
  const list = PERSONAL[configCampSel] || [];
  list.push({id:'p'+Date.now(), nombre, cedula, cargo, fechaIngreso, estado:'Trabajando', activo:true, novedad:'INGRESA'});
  PERSONAL[configCampSel] = list;
  await savePersonalAll();
  renderConfigPersonal();
}


init();
</script>
</body>
</html>
